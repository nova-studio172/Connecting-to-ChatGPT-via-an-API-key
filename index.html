<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ChatGPT">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<title>Chat</title>
<style>
:root{color-scheme:light;--bg:#fff;--panel:#fff;--text:#202123;--muted:#8b919b;--line:#e4e7ec;--soft:#f6f7f9;--blue:#2785f7;--blue-soft:#eaf3ff;--shadow:0 8px 28px rgba(22,34,51,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif;background:#fff;color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px}
.icon-btn{width:40px;height:40px;border:1px solid transparent;background:transparent;border-radius:50%;display:grid;place-items:center;color:#4d5561}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top-left,.top-right{display:flex;align-items:center;gap:6px}
.brand{font-size:17px;font-weight:650;letter-spacing:-.4px}
.messages{flex:1;min-height:0;overflow:auto;padding:16px 18px 22px;scroll-behavior:smooth}
.welcome{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#a0a5ae;font-size:14px;padding:20px}
.message{max-width:820px;width:100%;margin:0 auto 24px;display:flex;flex-direction:column;gap:7px}
.message.user{align-items:flex-end}
.role{font-size:12px;color:#8b919b;padding:0 4px}
.bubble{max-width:min(100%,720px);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:15px}
.user .bubble{background:#f2f4f7;border-radius:20px;padding:11px 15px}
.assistant .bubble{padding:0 4px}
.bubble pre{white-space:pre-wrap;overflow:auto;background:#f6f7f9;padding:12px;border-radius:10px}
.composer-wrap{flex-shrink:0;padding:8px 10px max(10px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 16%)}
.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid #dfe3e9;border-radius:28px;padding:10px 10px 10px 17px;box-shadow:var(--shadow);background:#fff;min-height:66px}
#prompt{resize:none;border:0;outline:0;flex:1;min-width:0;max-height:180px;min-height:42px;padding:10px 0 8px;color:#22262d;background:transparent;line-height:1.45}
#prompt::placeholder{color:#9ba2ad;opacity:1}
.send{flex:0 0 42px;width:42px;height:42px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.45;cursor:default}
.send svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.status{height:15px;text-align:center;color:#9aa0aa;font-size:10px;padding-top:3px}
.overlay{position:fixed;inset:0;background:rgba(25,30,40,.34);opacity:0;visibility:hidden;transition:opacity .24s,visibility .24s;z-index:10}
.overlay.open{opacity:1;visibility:visible}
.sidebar{position:fixed;z-index:11;inset:0 auto 0 0;width:min(80%,360px);background:#f8f9fb;transform:translateX(-102%);transition:transform .27s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding: max(20px,env(safe-area-inset-top)) 13px max(14px,env(safe-area-inset-bottom));box-shadow:8px 0 30px rgba(0,0,0,.08)}
.sidebar.open{transform:translateX(0)}
.sidebar-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 8px;margin-bottom:19px}
.sidebar-brand{font-size:22px;font-weight:650;letter-spacing:-.8px}
.search-box{height:44px;display:flex;align-items:center;gap:9px;padding:0 13px;background:#fff;border:1px solid #e3e6eb;border-radius:15px;margin:0 2px 22px}
.search-box svg{width:18px;height:18px;stroke:#8e95a0;fill:none;stroke-width:1.8;flex-shrink:0}
.search-box input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:14px;color:#252932}
.search-box input::placeholder{color:#9ba1aa}
.section-label{font-size:12px;font-weight:650;color:#858c97;padding:0 10px 8px;letter-spacing:.2px}
.recent-list{overflow:auto;flex:1;min-height:0}
.history-item{width:100%;border:0;background:transparent;border-radius:11px;text-align:left;padding:11px 10px;font-size:14px;color:#343942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.history-item:hover,.history-item.current{background:#e9edf3}
.history-empty{padding:12px 10px;font-size:13px;color:#8a919c;line-height:1.5}
.sidebar-bottom{padding-top:12px;border-top:1px solid #e7e9ee}
.new-chat{width:100%;border:1px solid #e0e4ea;background:#fff;border-radius:14px;padding:11px 12px;text-align:left;color:#3b424d;font-size:14px}
.modal-backdrop{position:fixed;inset:0;background:rgba(18,24,34,.38);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.open{display:flex}
.modal{width:min(100%,420px);border-radius:22px;background:#fff;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal h2{font-size:18px;margin:0;font-weight:650}
.modal label{display:block;font-size:13px;color:#606875;margin:14px 0 7px}
.modal input{width:100%;border:1px solid #dfe3e9;border-radius:12px;padding:12px;outline:none}
.modal input:focus,.settings-select:focus{border-color:var(--blue)}
.settings-select{width:100%;border:1px solid #dfe3e9;border-radius:12px;padding:12px 34px 12px 12px;background-color:#fff;color:#252932;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23606875%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27m6 9 6 6 6-6%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 22px center;background-size:16px 16px}
.help{font-size:12px;color:#858c97;line-height:1.5;margin-top:9px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.backup-actions .action{min-height:42px;padding:9px 8px;font-size:13px}
.delete-modal{max-width:340px;text-align:center}.delete-modal .modal-actions{margin-top:22px}.delete-modal .action{min-height:42px}
.history-item{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.action{border:1px solid #e0e4ea;background:#fff;color:#414854;padding:10px 14px;border-radius:12px}
.action.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.error{color:#c33;font-size:13px;white-space:pre-wrap;padding:8px 4px}
@media(min-width:760px){.topbar{padding:0 22px}.messages{padding-left:30px;padding-right:30px}.composer-wrap{padding-left:10px;padding-right:10px}.composer,.status{max-width:980px;margin-left:auto;margin-right:auto}.composer-wrap{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-left">
      <button class="icon-btn" id="menuBtn" aria-label="開啟側邊欄" title="聊天記錄">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="brand">ChatGPT</span>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="開啟設定" title="設定" onclick="(function(){var m=document.getElementById('settingsModal');var s={};try{s=JSON.parse(localStorage.getItem('ota_chat_settings_v1')||'{}')}catch(e){};document.getElementById('apiKey').value=s.apiKey||'';document.getElementById('baseUrl').value=s.baseUrl||'';document.getElementById('modelSelect').value=s.model||'gpt-5.6-sol';m.classList.add('open');})();">
        <span aria-hidden="true" style="font-size:23px;line-height:1;font-weight:500">⌘</span>
      </button>
    </div>
  </header>

  <main class="messages" id="messages" aria-live="polite"></main>

  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="1" placeholder="Ask ChatGPT" aria-label="輸入訊息"></textarea>
      <button class="send" id="sendBtn" aria-label="傳送" title="傳送" type="submit">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </button>
    </form>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar" aria-label="聊天記錄側邊欄">
  <div class="sidebar-head">
    <div class="sidebar-brand">ChatGPT</div>
    <button class="icon-btn" id="closeSidebar" aria-label="關閉側邊欄">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <form class="search-box" id="searchForm">
    <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="搜索聊天記錄" autocomplete="off" aria-label="搜索聊天記錄">
  </form>
  <div class="section-label" id="recentLabel">Recents</div>
  <div class="recent-list" id="historyList"></div>
  <div class="sidebar-bottom">
    <button class="new-chat" id="newChatBtn">＋　新聊天</button>
  </div>
</aside>

<div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal">
    <div class="modal-head">
      <h2 id="settingsTitle">設定</h2>
      <button class="icon-btn" id="closeSettings" aria-label="關閉設定">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <label for="modelSelect">聊天模型</label>
    <select id="modelSelect" class="settings-select">
      <option value="gpt-5.6-sol">5.6 Sol</option>
      <option value="gpt-5.6-terra">5.6 Terra</option>
      <option value="gpt-5.6-luna">5.6 Luna</option>
    </select>
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="輸入 API Key" autocomplete="off">
    <div class="help">API Key 會儲存在此瀏覽器的本地儲存空間。請勿在共用裝置上保存私密金鑰。</div>
    <label for="baseUrl">API Base URL</label>
    <input id="baseUrl" type="url" value="" placeholder="https://your-api.example/v1" spellcheck="false">
    <div class="help">請確認 API 服務允許瀏覽器跨來源請求（CORS）。</div>
    <label>聊天記錄備份</label>
    <div class="backup-actions">
      <button class="action" id="exportBtn" type="button">導出聊天記錄（JSON）</button>
      <button class="action" id="importBtn" type="button">匯入聊天記錄（JSON）</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <div class="help">導出會包含所有聊天記錄；匯入會合併記錄，相同 ID 的對話將由匯入版本取代。</div>
    <div class="modal-actions">
      <button class="action" id="cancelSettings">取消</button>
      <button class="action primary" id="saveSettings">儲存</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
  <div class="modal delete-modal">
    <h2 id="deleteTitle" style="margin:0 0 10px;font-size:18px">確認刪除</h2>
    <div id="deleteQuestion" style="font-size:14px;line-height:1.6;color:#555d68;overflow-wrap:anywhere">是否刪除？</div>
    <div class="modal-actions" style="display:flex;gap:10px">
      <button class="action" id="cancelDelete" style="flex:1">取消</button>
      <button class="action" id="confirmDelete" style="flex:1;background:#e53935;color:white;border-color:#e53935">確認</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = 'ota_chat_conversations_v1';
  const SETTINGS_KEY = 'ota_chat_settings_v1';
  const models = {
    'gpt-5.6-sol': '5.6 Sol',
    'gpt-5.6-terra': '5.6 Terra',
    'gpt-5.6-luna': '5.6 Luna'
  };
  let selectedModel = 'gpt-5.6-sol';
  let conversations = loadConversations();
  let currentId = null;
  let busy = false;
  let searchTerm = '';
  let pendingDeleteId = null;
  let longPressTimer = null;
  let suppressNextHistoryClick = false;

  // IndexedDB is the primary durable store; localStorage remains a fallback.
  const DB_NAME = 'ota_chat_persistent_v1';
  const DB_STORE = 'records';
  function openDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    });
  }
  async function dbGet(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(key);
      req.onsuccess = () => { db.close(); resolve(req.result); };
      req.onerror = () => { db.close(); reject(req.error); };
    });
  }
  async function dbPut(key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(value, key);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = tx.onabort = () => { db.close(); reject(tx.error || new Error('IndexedDB write failed')); };
    });
  }
  function loadConversations() {
    try { const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); return Array.isArray(value) ? value : []; }
    catch { return []; }
  }
  function getSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); }
    catch { return window.__otaSettingsCache || {}; }
  }
  async function getSettingsDurable() {
    let s = getSettings();
    if (!s.apiKey) { try { const saved = await dbGet(SETTINGS_KEY); if (saved && saved.apiKey) s = saved; } catch {} }
    window.__otaSettingsCache = s;
    return s;
  }
  function saveAll() {
    const snapshot = JSON.stringify(conversations);
    try { localStorage.setItem(STORAGE_KEY, snapshot); } catch (e) { setStatus('本地儲存不可用，正在嘗試使用瀏覽器資料庫。'); }
    dbPut(STORAGE_KEY, conversations).catch(() => setStatus('無法寫入瀏覽器資料庫；請勿使用無痕模式，並確認網站儲存權限已開啟。'));
  }
  function activeConversation() { return conversations.find(c => c.id === currentId) || null; }
  function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function startNewChat() {
    currentId = null;
    $('messages').innerHTML = '<div class="welcome">今天有什麼想聊的？</div>';
    $('prompt').value = '';
    resizePrompt();
    renderHistory();
    closeSidebar();
    $('prompt').focus();
  }
  function ensureConversation(firstText) {
    let c = activeConversation();
    if (!c) {
      c = {id:makeId(), title:makeTitle(firstText), createdAt:Date.now(), updatedAt:Date.now(), model:selectedModel, messages:[]};
      conversations.unshift(c);
      currentId = c.id;
    } else if (!c.messages.length) c.title = makeTitle(firstText);
    c.updatedAt = Date.now();
    return c;
  }
  function makeTitle(text) {
    const cleaned = String(text || '').replace(/\s+/g, ' ').trim();
    return cleaned.length > 34 ? cleaned.slice(0, 34) + '…' : (cleaned || '新聊天');
  }
  function setStatus(text='') { $('status').textContent = text; }
  function renderMessages() {
    const container = $('messages');
    const c = activeConversation();
    if (!c || !c.messages.length) {
      container.innerHTML = '<div class="welcome">今天有什麼想聊的？</div>';
      return;
    }
    container.innerHTML = '';
    for (const msg of c.messages) {
      const wrap = document.createElement('article');
      wrap.className = 'message ' + (msg.role === 'user' ? 'user' : 'assistant');
      const role = document.createElement('div');
      role.className = 'role';
      role.textContent = msg.role === 'user' ? '你' : models[c.model || selectedModel] || 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.content || '';
      wrap.append(role, bubble);
      container.appendChild(wrap);
    }
    container.scrollTop = container.scrollHeight;
  }
  function renderHistory() {
    const list = $('historyList');
    list.innerHTML = '';
    const q = searchTerm.trim().toLocaleLowerCase();
    const matches = conversations.filter(c => !q || c.title.toLocaleLowerCase().includes(q) || c.messages.some(m => String(m.content || '').toLocaleLowerCase().includes(q)));
    $('recentLabel').textContent = q ? '搜尋結果' : 'Recents';
    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = q ? '找不到符合的聊天記錄。' : '目前沒有聊天記錄。';
      list.appendChild(empty);
      return;
    }
    for (const c of matches) {
      const btn = document.createElement('button');
      btn.className = 'history-item' + (c.id === currentId ? ' current' : '');
      btn.textContent = c.title || '新聊天';
      btn.title = c.title || '新聊天';
      btn.addEventListener('click', () => {
        if (suppressNextHistoryClick) { suppressNextHistoryClick = false; return; }
        openConversation(c.id);
      });
      const beginPress = e => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => { suppressNextHistoryClick = true; showDeleteDialog(c.id); }, 650);
      };
      const cancelPress = () => { clearTimeout(longPressTimer); };
      btn.addEventListener('pointerdown', beginPress);
      btn.addEventListener('pointerup', cancelPress);
      btn.addEventListener('pointerleave', cancelPress);
      btn.addEventListener('pointercancel', cancelPress);
      btn.addEventListener('contextmenu', e => { e.preventDefault(); showDeleteDialog(c.id); });
      list.appendChild(btn);
    }
  }
  function openConversation(id) {
    currentId = id;
    const c = activeConversation();
    if (c) selectedModel = c.model || selectedModel;
    updateModelButtons();
    renderMessages();
    renderHistory();
    closeSidebar();
  }
  function updateModelButtons() {
    const select = $('modelSelect');
    if (select) select.value = selectedModel;
  }
  function openSidebar() {
    $('overlay').classList.add('open');
    $('sidebar').classList.add('open');
    $('searchInput').value = searchTerm;
    renderHistory();
  }
  function closeSidebar() {
    $('overlay').classList.remove('open');
    $('sidebar').classList.remove('open');
  }
  function resizePrompt() {
    const el = $('prompt');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  }
  async function sendMessage(text) {
    if (busy || !text.trim()) return;
    const settings = await getSettingsDurable();
    if (settings.model && models[settings.model] && !activeConversation()) selectedModel = settings.model;
    if (!settings.apiKey) {
      $('settingsModal').classList.add('open');
      $('apiKey').focus();
      setStatus('請先在設定中輸入 API Key。');
      return;
    }
    const c = ensureConversation(text);
    c.model = selectedModel;
    c.messages.push({role:'user', content:text.trim()});
    c.updatedAt = Date.now();
    saveAll(); renderMessages(); renderHistory();
    $('prompt').value = ''; resizePrompt();
    busy = true; $('sendBtn').disabled = true; setStatus('正在思考…');
    const waiting = {role:'assistant', content:'…'};
    c.messages.push(waiting); renderMessages();
    try {
      const base = String(settings.baseUrl || '').trim().replace(/\/+$/, '');
      if (!base) throw new Error('請先在設定中填寫 API Base URL。');
      const response = await fetch(base + '/chat/completions', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer ' + settings.apiKey},
        body:JSON.stringify({
          model:selectedModel,
          messages:c.messages.filter(m => m !== waiting).map(m => ({role:m.role,content:m.content})),
          stream:false
        })
      });
      const raw = await response.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error('伺服器回傳的內容不是有效 JSON（HTTP ' + response.status + '）。\n' + raw.slice(0,500)); }
      if (!response.ok) throw new Error((data.error && (data.error.message || data.error)) || data.message || ('HTTP ' + response.status));
      const answer = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (typeof answer !== 'string') throw new Error('API 回應中沒有 choices[0].message.content。');
      c.messages[c.messages.length - 1] = {role:'assistant', content:answer};
      c.updatedAt = Date.now();
      saveAll(); renderMessages(); renderHistory(); setStatus('');
    } catch (err) {
      c.messages.pop();
      c.messages.push({role:'assistant', content:'請求失敗：' + (err && err.message ? err.message : String(err)) + '\n\n請檢查 API Key、Base URL、模型名稱，以及 API 服務是否允許 CORS。'});
      saveAll(); renderMessages(); renderHistory(); setStatus('傳送失敗');
    } finally {
      busy = false; $('sendBtn').disabled = false; $('prompt').focus();
    }
  }

  $('menuBtn').addEventListener('click', openSidebar);
  $('closeSidebar').addEventListener('click', closeSidebar);
  $('overlay').addEventListener('click', closeSidebar);
  $('newChatBtn').addEventListener('click', startNewChat);
  $('searchForm').addEventListener('submit', e => { e.preventDefault(); searchTerm = $('searchInput').value; renderHistory(); });
  $('searchInput').addEventListener('input', () => { searchTerm = $('searchInput').value; renderHistory(); });
  $('prompt').addEventListener('input', resizePrompt);
  $('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('chatForm').requestSubmit(); }
  });
  $('chatForm').addEventListener('submit', e => { e.preventDefault(); const text = $('prompt').value; sendMessage(text); });
  function showDeleteDialog(id) {
    const c = conversations.find(item => item.id === id);
    if (!c) return;
    pendingDeleteId = id;
    $('deleteQuestion').textContent = `是否刪除「${c.title || '新聊天'}」？`;
    $('deleteModal').classList.add('open');
  }
  function closeDeleteDialog() { $('deleteModal').classList.remove('open'); pendingDeleteId = null; }
  $('cancelDelete').addEventListener('click', closeDeleteDialog);
  $('deleteModal').addEventListener('click', e => { if (e.target === $('deleteModal')) closeDeleteDialog(); });
  $('confirmDelete').addEventListener('click', () => {
    if (!pendingDeleteId) return;
    const removedId = pendingDeleteId;
    conversations = conversations.filter(c => c.id !== removedId);
    if (currentId === removedId) {
      currentId = null;
      const latest = [...conversations].sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      if (latest) { currentId = latest.id; selectedModel = latest.model || selectedModel; renderMessages(); updateModelButtons(); }
      else $('messages').innerHTML = '<div class="welcome">今天有什麼想聊的？</div>';
    }
    saveAll(); renderHistory(); closeDeleteDialog(); setStatus('聊天記錄已刪除。');
  });
  $('exportBtn').addEventListener('click', () => {
    const payload = {format:'ota-chat-history', version:1, exportedAt:new Date().toISOString(), conversations};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'chat-history-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus(`已匯出全部 ${conversations.length} 個聊天記錄。`);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const incoming = Array.isArray(data) ? data : data.conversations;
      if (!Array.isArray(incoming) || incoming.some(c => !c || typeof c.id !== 'string' || !Array.isArray(c.messages))) throw new Error('JSON 格式不正確，找不到有效的 conversations 聊天記錄。');
      const merged = new Map(conversations.map(c => [c.id, c]));
      for (const c of incoming) merged.set(c.id, c);
      conversations = [...merged.values()].sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      saveAll(); renderHistory();
      if (!currentId && conversations.length) { currentId = conversations[0].id; selectedModel = conversations[0].model || selectedModel; renderMessages(); updateModelButtons(); }
      setStatus(`匯入完成，合併後共有 ${conversations.length} 個聊天記錄。`); closeSidebar();
    } catch (err) { setStatus('匯入失敗：' + (err.message || String(err))); }
    e.target.value = '';
  });

  function closeSettings() { $('settingsModal').classList.remove('open'); }
  $('closeSettings').addEventListener('click', closeSettings);
  $('cancelSettings').addEventListener('click', closeSettings);
  $('settingsModal').addEventListener('click', e => { if (e.target === $('settingsModal')) closeSettings(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSidebar(); closeSettings(); closeDeleteDialog(); }
  });

  // Hydrate from IndexedDB on startup, then mirror the restored data to localStorage.
  (async () => {
    try {
      const durableChats = await dbGet(STORAGE_KEY);
      if (Array.isArray(durableChats) && durableChats.length) {
        const local = loadConversations();
        conversations = local.length ? local : durableChats;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); } catch {}
      }
      const durableSettings = await dbGet(SETTINGS_KEY);
      if (durableSettings) {
        if (durableSettings.model && models[durableSettings.model]) selectedModel = durableSettings.model;
        window.__otaSettingsCache = durableSettings;
        try { if (!localStorage.getItem(SETTINGS_KEY)) localStorage.setItem(SETTINGS_KEY, JSON.stringify(durableSettings)); } catch {}
      }
    } catch (e) { /* localStorage fallback remains available */ }
    currentId = null;
    $('messages').innerHTML = '<div class="welcome">今天有什麼想聊的？</div>';
    updateModelButtons(); renderHistory();
  })();
})();
</script>
<script>
(function () {
  const byId = id => document.getElementById(id);
  const KEY = 'ota_chat_settings_v1';
  const DB = 'ota_chat_persistent_v1';
  const STORE = 'records';
  function readSettings() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) { return {}; }
  }
  function openDialog() {
    const saved = readSettings();
    byId('apiKey').value = saved.apiKey || '';
    byId('baseUrl').value = saved.baseUrl || '';
    byId('modelSelect').value = saved.model || 'gpt-5.6-sol';
    byId('settingsModal').classList.add('open');
  }
  function saveToIndexedDB(value) {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB 不可用'));
      const request = indexedDB.open(DB, 1);
      request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains(STORE)) request.result.createObjectStore(STORE); };
      request.onerror = () => reject(request.error || new Error('資料庫開啟失敗'));
      request.onsuccess = () => {
        const db = request.result;
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(value, KEY);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = tx.onabort = () => { db.close(); reject(tx.error || new Error('資料庫寫入失敗')); };
      };
    });
  }
  byId('settingsBtn').addEventListener('click', openDialog);
  byId('saveSettings').addEventListener('click', async function () {
    const apiKey = byId('apiKey').value.trim();
    const baseUrl = byId('baseUrl').value.trim().replace(/\/+$/, '');
    const model = byId('modelSelect').value;
    if (!baseUrl) { byId('baseUrl').focus(); return; }
    const settings = { apiKey, baseUrl, model };
    let localSaved = false;
    try { localStorage.setItem(KEY, JSON.stringify(settings)); localSaved = true; } catch (_) {}
    try {
      await saveToIndexedDB(settings);
      byId('settingsModal').classList.remove('open');
      byId('status').textContent = '設定已儲存。';
      // Reload so the main chat logic consistently adopts the newly selected model and settings.
      window.location.reload();
    } catch (err) {
      if (localSaved) {
        byId('settingsModal').classList.remove('open');
        byId('status').textContent = '設定已儲存至 localStorage；瀏覽器資料庫不可用。';
        window.location.reload();
      } else {
        byId('status').textContent = '儲存失敗：' + (err && err.message ? err.message : String(err));
      }
    }
  });
  byId('closeSettings').addEventListener('click', () => byId('settingsModal').classList.remove('open'));
  byId('cancelSettings').addEventListener('click', () => byId('settingsModal').classList.remove('open'));
  byId('settingsModal').addEventListener('click', e => { if (e.target === byId('settingsModal')) byId('settingsModal').classList.remove('open'); });
})();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')

}
